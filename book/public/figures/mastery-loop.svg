<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="310" viewBox="0 0 1380 310" role="img" aria-labelledby="title desc">
<title id="title">从意图到交付的工作闭环</title>
<desc id="desc">意图、事实、路线、执行、证据、调整、交付七个环节，发现缺口时可回到事实和目标重新检查。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102338"/><stop offset="1" stop-color="#0b1423"/></linearGradient>
  <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#e3a368"/><stop offset="1" stop-color="#ffdcaa"/></linearGradient>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#9dabb9" stroke-width="1.7"/></marker>
</defs>
<rect width="1380" height="310" rx="18" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle">
  <g fill="#a3b7ca" font-size="14"><text x="690" y="35">从意图到可验证交付 · 不断回到事实修正方向</text></g>
  <g>
  <rect x="24" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#bc965f"/>
  <rect x="218" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#516c85"/>
  <rect x="412" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#516c85"/>
  <rect x="606" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#516c85"/>
  <rect x="800" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#516c85"/>
  <rect x="994" y="80" width="165" height="105" rx="12" fill="#37323a" stroke="#bc965f"/>
  <rect x="1188" y="80" width="165" height="105" rx="12" fill="#23364b" stroke="#516c85"/>
  </g>
  <g font-family="monospace" fill="#ecae72" font-size="13">
    <text x="106" y="109">01</text><text x="300" y="109">02</text><text x="494" y="109">03</text><text x="688" y="109">04</text><text x="882" y="109">05</text><text x="1076" y="109">06</text><text x="1270" y="109">07</text>
  </g>
  <g fill="#f5f1e9" font-size="25" font-weight="700"><text x="106" y="151">意图</text><text x="300" y="151">事实</text><text x="494" y="151">路线</text><text x="688" y="151">执行</text><text x="882" y="151">证据</text><text x="1076" y="151">调整</text><text x="1270" y="151">交付</text></g>
</g>
<g stroke="#a9b6c5" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M191 132 H215"/><path d="M385 132 H409"/><path d="M579 132 H603"/><path d="M773 132 H797"/><path d="M967 132 H991"/><path d="M1161 132 H1185"/></g>
<path d="M1077 186 V247 H299 V189" fill="none" stroke="#d3a575" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arr)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" fill="#ddb085" font-size="14" text-anchor="middle"><text x="689" y="239">证据不足时回到事实检查，而不是持续叠加补丁</text></g>
</svg>
