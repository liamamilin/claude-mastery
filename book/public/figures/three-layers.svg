<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
<title id="t">“完成”的三个层次：说明、操作、结果</title>
<desc id="d">Claude 的说明可以指向实际操作，操作产生文件变化，结果需要你自己打开验证。只有第三层能证明目标达成。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#9bb0c4" stroke-width="1.8"/></marker></defs>
<rect width="960" height="330" rx="16" fill="#0b1220"/>
<g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
<text x="480" y="38" fill="#9bb0c4" font-size="15">同一句“已完成”，可能停在不同的层次</text>
<g>
<rect x="30" y="64" width="270" height="170" rx="12" fill="#101d2b" stroke="#516c85"/>
<rect x="345" y="64" width="270" height="170" rx="12" fill="#101d2b" stroke="#516c85"/>
<rect x="660" y="64" width="270" height="170" rx="12" fill="#1a2330" stroke="#e8ad66" stroke-width="2"/>
</g>
<g fill="#e8ad66" font-size="13" font-family="monospace"><text x="165" y="92">LAYER 1</text><text x="480" y="92">LAYER 2</text><text x="795" y="92">LAYER 3</text></g>
<g fill="#f4f1e9" font-size="26" font-weight="700"><text x="165" y="130">说明</text><text x="480" y="130">操作</text><text x="795" y="130">结果</text></g>
<g fill="#c3d0dc" font-size="15">
<text x="165" y="165">Claude 说它做了什么</text><text x="165" y="188">看：对话里的总结</text>
<text x="480" y="165">它实际读写了哪些文件</text><text x="480" y="188">看：操作记录 · diff · 文件夹</text>
<text x="795" y="165">成果能不能被打开使用</text><text x="795" y="188">看：浏览器里的真实行为</text>
</g>
<g fill="#9bb0c4" font-size="13"><text x="165" y="218">可能与事实不符</text><text x="480" y="218">说明“动过”，不说明“好用”</text><text x="795" y="218" fill="#e8ad66">才能证明目标达成</text></g>
<g stroke="#9bb0c4" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M302 149H340"/><path d="M617 149H655"/></g>
<text x="480" y="285" fill="#9bb0c4" font-size="14">层次越靠右，越不依赖 Claude 的措辞；验收尽量落在最右侧。</text>
<path d="M795 238V258H480" stroke="#e8ad66" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
</g></svg>
